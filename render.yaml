# ============================================================================
#  Render Blueprint — despliegue de la aplicación completa
#  Arquitectura:  React/Vite (Static Site)  ->  Flask/Gunicorn  ->  PostgreSQL
#
#  Cómo usarlo:
#    1. Subir este repositorio a GitHub/GitLab.
#    2. En Render: New +  ->  Blueprint  ->  seleccionar el repo.
#    3. Render leerá este archivo y creará los 3 recursos.
#    4. Completar las variables marcadas como sync:false (ver RENDER.md).
# ============================================================================

databases:
  - name: inmobiliaria-db
    databaseName: inmobiliaria_db
    user: inmobiliaria
    plan: free            # OJO: la BD free de Render EXPIRA a los 30 días y se elimina.

services:
  # ── Backend Flask (API REST) ──────────────────────────────────────────────
  - type: web
    name: inmobiliaria-backend
    runtime: python
    plan: starter          # $7/mes: no se duerme por inactividad
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 "app:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: inmobiliaria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render genera un valor aleatorio seguro
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false                  # p. ej. https://inmobiliaria-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false                  # normalmente igual a FRONTEND_URL
      # Pasarela de pagos (opcional; si se dejan vacías, el sistema usa modo TEST)
      - key: PAGOPAR_PUBLIC_KEY
        sync: false
      - key: PAGOPAR_PRIVATE_KEY
        sync: false
      - key: PAGOPAR_URL_RETORNO
        sync: false
      - key: PAGOPAR_URL_NOTIFICACION
        sync: false

  # ── Frontend React/Vite (Static Site) ─────────────────────────────────────
  - type: web
    name: inmobiliaria-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # La URL del backend se "hornea" en el build. Debe apuntar al backend de
      # Render, terminando en /api. Ej: https://inmobiliaria-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta desconocida cae en index.html (React Router)
      - type: rewrite
        source: /*
        destination: /index.html

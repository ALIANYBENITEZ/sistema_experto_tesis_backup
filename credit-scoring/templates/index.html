<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoreHouse – Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">

  <!-- Animated background -->
  <div class="bg-animated">
    <div class="bg-gradient"></div>
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
      <div class="shape shape-6"></div>
    </div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Login container -->
  <div class="login-wrapper">

    <!-- Brand -->
    <div class="brand-header">
      <div class="brand-logo">
        <div class="logo-icon">
          <i class="fas fa-house-chimney"></i>
        </div>
        <span class="logo-text">Score<span class="logo-accent">House</span></span>
      </div>
      <p class="brand-tagline">Decisiones crediticias inteligentes para el sector inmobiliario</p>
    </div>

    <!-- Glass card -->
    <div class="glass-card login-card">
      <div class="card-header-text">
        <h2>Bienvenido de vuelta</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Correo electrónico
          </label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="usuario@empresa.com" required />
            <span class="input-focus-bar"></span>
          </div>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Contraseña
          </label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
            <span class="input-focus-bar"></span>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" />
            <span class="checkmark"></span>
            Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary btn-full" id="loginBtn">
          <span class="btn-text">Iniciar sesión</span>
          <span class="btn-loader hidden"><i class="fas fa-circle-notch fa-spin"></i></span>
        </button>

        <div id="loginError" class="alert-error hidden">
          <i class="fas fa-triangle-exclamation"></i>
          <span id="loginErrorMsg">Credenciales inválidas</span>
        </div>
      </form>

      <div class="card-footer-text">
        <p>¿No tienes cuenta? <a href="#">Contacta a tu administrador</a></p>
      </div>
    </div>

    <!-- Demo hint -->
    <div class="demo-hint">
      <i class="fas fa-circle-info"></i>
      Demo: usa cualquier correo y contraseña para ingresar
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errBox   = document.getElementById('loginError');

      // Basic validation
      let valid = true;
      if (!email) {
        document.getElementById('emailError').textContent = 'El correo es requerido';
        valid = false;
      } else {
        document.getElementById('emailError').textContent = '';
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'La contraseña es requerida';
        valid = false;
      } else {
        document.getElementById('passwordError').textContent = '';
      }
      if (!valid) return;

      // Show loader
      btn.querySelector('.btn-text').classList.add('hidden');
      btn.querySelector('.btn-loader').classList.remove('hidden');
      btn.disabled = true;
      errBox.classList.add('hidden');

      try {
        const res  = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          document.getElementById('loginErrorMsg').textContent = data.message || 'Error al iniciar sesión';
          errBox.classList.remove('hidden');
        }
      } catch(err) {
        document.getElementById('loginErrorMsg').textContent = 'Error de conexión. Intenta de nuevo.';
        errBox.classList.remove('hidden');
      } finally {
        btn.querySelector('.btn-text').classList.remove('hidden');
        btn.querySelector('.btn-loader').classList.add('hidden');
        btn.disabled = false;
      }
    });

    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
